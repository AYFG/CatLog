spring.application.name=catlog-spring-back

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:catlog}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

app.jwt.access-secret=${AUTH_SECRET}
app.jwt.refresh-secret=${AUTH_REFRESH_SECRET}
app.jwt.access-token-validity-seconds=86400
app.jwt.refresh-token-validity-seconds=1209600

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:5173,http://127.0.0.1:19006,http://127.0.0.1:3000,http://127.0.0.1:5173}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
